spring:
  application:
    name: election
  datasource:
    url: jdbc:h2:mem:elections
    driverClassName: org.h2.Driver
    username: admin
    password: secret

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

  cache:
    type: caffeine
    cache-names:
      - electionResults
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=60s